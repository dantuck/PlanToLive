name: Lantern
tagline: A private dashboard for your household.
description: >-
  A shared calendar and meal plan, chores with points and rewards, screen time
  timers, and shared lists, all on one screen for the whole household. Install
  it as an app or leave it up on a kitchen tablet.
accent: '#c2570a'
order: 1
status: open-source
statusNote: Free and self-hosted. You run it in your own Cloudflare account, and no one else sees your data.
icon: /apps/lantern-icon.svg
screenshot: /apps/lantern-shot.webp
screenshotAlt: Lantern's chores page with a household goal, family members, and chore filters
links:
